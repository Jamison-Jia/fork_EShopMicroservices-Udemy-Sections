services:
  catalogdb:
    image: postgres:16
    
  basketdb:
    image: postgres:16
    
  distributedcache:
    image: redis
    
  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.API/Dockerfile

  basket.api:
    image: ${DOCKER_REGISTRY-}basketapi
    build:
      context: .
      dockerfile: Services/Busket/Basket.Api/Dockerfile

volumes:
  postgres_catalog:
  postgres_basket:


